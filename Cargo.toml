[package]
name = "avdumpr"
version = "0.1.0"
edition = "2021"
description = "AVDumpR — Rust port of AVDump3: hashes (ED2K, CRC32, SHA, TTH, …) and media metadata reports in one pass, no native dependencies"
license = "MIT"
repository = "https://github.com/sandwichfarm/avdump-rust"
readme = "README.md"
keywords = ["hash", "ed2k", "anidb", "mediainfo", "matroska"]
categories = ["command-line-utilities", "multimedia"]
rust-version = "1.80"
exclude = [".github/*"]

[[bin]]
name = "avdumpr"
path = "src/main.rs"

[dependencies]
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md4 = "0.10"
tiger = "0.2"
digest = "0.10"
crc32fast = "1.4"
crc32c = "0.6"
regex = "1.10"
mediainfo = { package = "mediainfo-rust", version = "0.1.0" }
libc = "0.2"
crossterm = "0.29"
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
