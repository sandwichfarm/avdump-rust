[package]
name = "avdump3"
version = "3.2.0"
edition = "2021"
description = "AVDump3 — multi-hash and media metadata dumper (Rust port)"
license = "MIT"
repository = "https://github.com/sandwichfarm/avdump-rust"
rust-version = "1.80"

[[bin]]
name = "avdump3"
path = "src/main.rs"

[dependencies]
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md4 = "0.10"
tiger = "0.2"
digest = "0.10"
crc32fast = "1.4"
crc32c = "0.6"
regex = "1.10"
mediainfo = { package = "mediainfo-rust", path = "../mediainfo-rust" }
libc = "0.2"
crossterm = "0.29"
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
