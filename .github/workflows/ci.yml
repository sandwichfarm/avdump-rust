name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The mediainfo-rust dependency is a private git repository fetched over SSH: add a read-only
      # deploy key of that repository as the MEDIAINFO_RUST_DEPLOY_KEY secret. Not needed once the
      # dependency comes from crates.io (or the repository is public).
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY != '' }}
        with:
          ssh-private-key: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --release

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY != '' }}
        with:
          ssh-private-key: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets
