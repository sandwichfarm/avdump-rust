name: Release

# Tag a release as `vX.Y.Z` (matching `version` in Cargo.toml):
#   git tag v0.1.0 && git push origin v0.1.0
# Publishes the `avdumpr` crate to crates.io (CARGO_REGISTRY_TOKEN secret) and attaches prebuilt
# binaries to a GitHub release. Publishing requires the pinned `mediainfo-rust` version to be on
# crates.io already (cargo drops the `git` part of the dependency when publishing).

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY != '' }}
        with:
          ssh-private-key: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: cargo test --release

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-13,       target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY != '' }}
        with:
          ssh-private-key: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=avdumpr-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp target/${{ matrix.target }}/release/avdumpr.exe README.md LICENSE "$name"/
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/avdumpr README.md LICENSE "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: avdumpr-*.${{ matrix.archive }}
          generate_release_notes: true
