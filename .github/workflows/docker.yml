name: Docker

# Builds the multi-arch image and pushes it to GitHub Container Registry:
#   ghcr.io/<owner>/avdumpr:latest      (every push to main)
#   ghcr.io/<owner>/avdumpr:X.Y.Z, X.Y  (release tags vX.Y.Z)
# Pull requests only build (no push). The build fetches the private mediainfo-rust dependency over
# SSH, so the MEDIAINFO_RUST_DEPLOY_KEY secret (read-only deploy key of that repository) is required
# while that repository is private.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/avdumpr

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MEDIAINFO_RUST_DEPLOY_KEY }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=avdumpr
            org.opencontainers.image.description=AVDump3 — multi-hash and media metadata dumper (Rust port)
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          ssh: default
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
